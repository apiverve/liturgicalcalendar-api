openapi: 3.0.4
info:
  title: Liturgical Calendar
  description: >-
    Liturgical Calendar retrieves Catholic liturgical calendar events for any
    given month. It details feast ranks, vestment colors, liturgical seasons,
    and holy days of obligation, while paid plans add custom year queries.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/liturgicalcalendar:
    get:
      summary: Liturgical Calendar
      description: >-
        Returns the Catholic liturgical calendar for one month. The response
        data is an object keyed by ISO date (YYYY-MM-DD), and each date holds an
        array of the celebrations falling on it — a date can carry more than
        one, such as a weekday plus an optional memorial. The fields below
        describe one celebration in those arrays.
      operationId: liturgicalcalendar
      parameters:
        - name: month
          in: query
          schema:
            type: integer
          required: false
          description: >-
            The month to get Liturgical Calendar data for (default: current
            month)
          example: 2
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: 'The year to get Liturgical Calendar data for (default: current year)'
          example: 2025
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
