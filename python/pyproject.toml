[project]
name = "apiverve-liturgicalcalendar"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Liturgical Calendar retrieves Catholic liturgical calendar events for any given month. It details feast ranks, vestment colors, liturgical seasons, and holy days of obligation, while paid plans add custom year queries."
keywords = ["liturgical calendar api", "catholic liturgical calendar", "catholic feast days", "holy days of obligation dates", "church calendar vestment colors"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/liturgicalcalendar?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/liturgicalcalendar?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/liturgicalcalendar-api"
Twitter = "https://twitter.com/apivervehq"
